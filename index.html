// ===== ПРОФИЛЬ: СОХРАНЕНИЕ =====
async function saveMe(o){await db.doc('users/'+me.uid).update(o);Object.assign(me,o);draw()}
async function edit(k,t){const v=prompt(t,me[k]||'');if(v===null)return;await saveMe({[k]:v.trim().slice(0,70)})}
async function editName(){const v=prompt('Имя',me.name||me.username);if(v===null)return;await saveMe({name:v.trim().slice(0,30)})}
function pickPhoto(){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();
    im.onload=async()=>{
      const c=document.createElement('canvas');c.width=c.height=160;
      const s=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);
      await saveMe({photo:c.toDataURL('image/jpeg',.7)})};
    im.src=URL.createObjectURL(f)};
  i.click()}

// ===== ГЛАВНЫЙ ЭКРАН =====
function home(){
  unsub();unsubList();
  const H=t=>`<div class=top><h1>${t}</h1></div>`;
  const head=tab==='settings'?H('Настройки')
    :tab==='profile'?H('Профиль')
    :tab==='contacts'?H('Контакты')
    :'<div class=top><div class=logo>M</div><h1>MajorGram</h1><button class=ib id=mn>⋮</button></div><div class=mnu id=mnu hidden><div id=m1>Новая группа или канал</div><div id=m2>Найти пользователя</div><div id=m3>Выйти</div></div>';
  app.innerHTML=`${head}<div class=body id=bd></div>${tab==='chats'?`<button class=fab2 id=fb2>${IC.cam}</button><button class=fab id=fb>${IC.pen}</button>`:''}
  <nav>${[['chats','Чаты',IC.chat],['contacts','Контакты',IC.con],['settings','Настройки',IC.set],['profile','Профиль',IC.pro]].map(([k,n,i])=>`<div class="ni${tab===k?' on':''}" data-t="${k}">${i}<span>${n}</span></div>`).join('')}</nav>`;
  if($('mn')){
    $('mn').onclick=()=>$('mnu').hidden=!$('mnu').hidden;
    $('m1').onclick=()=>{$('mnu').hidden=true;newChat()};
    $('m2').onclick=()=>{$('mnu').hidden=true;searchView()};
    $('m3').onclick=()=>auth.signOut()}
  if(tab==='chats'){$('fb').onclick=searchView;$('fb2').onclick=soon}
  document.querySelectorAll('.ni').forEach(n=>n.onclick=()=>{tab=n.dataset.t;home()});
  unsubList=db.collection('chats').where('members','array-contains',me.uid).onSnapshot(s=>{
    CH=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.lastAt?.seconds||0)-(x.lastAt?.seconds||0));
    $('cl')?list():draw()});
  draw()}
function list(){
  const l=$('cl');if(!l)return;
  $('c1').textContent=CH.length;$('c2').textContent=CH.filter(c=>c.type==='channel').length;
  const a=CH.filter(c=>flt==='all'||c.type==='channel');
  l.innerHTML=a.map(rowHtml).join('')||'<div class=empty>Пока пусто. Нажми ✎ и найди человека по юзернейму</div>';
  bindRows()}
function draw(){
  const b=$('bd');if(!b)return;
  if(tab==='chats'){
    b.innerHTML=`<div class=sq id=sq>Поиск чатов</div><div class=tabs><div class="tb${flt==='all'?' on':''}" data-f=all>Все чаты <i id=c1>0</i></div><div class="tb${flt==='channel'?' on':''}" data-f=channel>Каналы <i id=c2>0</i></div></div><div id=cl></div>`;
    $('sq').onclick=searchView;
    document.querySelectorAll('.tb').forEach(t=>t.onclick=()=>{flt=t.dataset.f;draw()});
    list()}
  else if(tab==='contacts'){
    const a=CH.filter(c=>c.type==='direct');
    b.innerHTML=`<div class=sq id=sq>Поиск по юзернейму</div>`+(a.map(rowHtml).join('')||'<div class=empty>Контактов пока нет</div>');
    $('sq').onclick=searchView;bindRows()}
  else if(tab==='settings'){
    const it=(a,c,i,t,r='')=>`<div class=it data-a=${a}><div class=ico style="background:${c}">${i}</div><div class=itt>${t}</div>${r}</div>`;
    b.innerHTML=`<div class=grp>${it('lang','#a355e8','🌐','Язык<small class=sub>Русский</small>')}</div>
    <div class=grp>${it('prem','#7b6cf0','★','MajorGram Premium')}${it('stars','#f5a623','★','Звёзды MajorGram',`<span class=val id=sbal>${STARS}</span>`)}${it('biz','#e5484d','🏪','MajorGram для бизнеса')}${it('gift','#f2711c','🎁','Отправить подарок')}</div>
    <div class=grp><div class=gt>Помощь</div>${it('ask','#f5a623','💬','Задать вопрос')}${it('faq','#2ea6ff','?','Вопросы о MajorGram')}${it('feat','#a355e8','💡','Возможности MajorGram')}${it('priv','#34c37a','🛡','Политика конфиденциальности')}</div>
    <div class=grp>${it('out','#2b3748','⎋','Выйти из аккаунта')}</div>
    <p class=ver>MajorGram v0.1</p>`;
    b.querySelectorAll('.it').forEach(e=>e.onclick=()=>{const a=e.dataset.a;a==='stars'?starsView():a==='out'?auth.signOut():soon()});
    getStars().then(n=>{STARS=n;const e=$('sbal');if(e)e.textContent=n})}
  else{
    b.innerHTML=`<div class=pring>${me.photo?`<img src="${me.photo}" style="width:100%;height:100%;object-fit:cover">`:av('@'+me.username,90)}</div>
    <div class=pn>${esc(me.name||'@'+me.username)}</div><div class=ps>в сети</div>
    <div class=pb><div id=pf><span>📷</span>Выбрать фото</div><div id=pe><span>✏️</span>Изменить</div><div id=pg><span>⚙️</span>Настройки</div></div>
    <div class="grp info"><div><b>${esc(auth.currentUser.email||'')}</b><small>Почта</small></div>
    <div><b>@${esc(me.username)}</b><small>Имя пользователя</small></div>
    <div id=pi2><b>${esc(me.about||'Не указано')}</b><small>О себе</small></div>
    <div id=pi3><b>${esc(me.bday||'Не указано')}</b><small>День рождения</small></div>
    <div id=pi4><b>Не указан</b><small>Телефон</small></div></div>`;
    $('pf').onclick=pickPhoto;$('pe').onclick=editName;
    $('pg').onclick=()=>{tab='settings';home()};
    $('pi2').onclick=()=>edit('about','О себе');
    $('pi3').onclick=()=>edit('bday','День рождения (например 31.12.2000)');
    $('pi4').onclick=soon}}

// ===== ЭКРАН ПОИСКА =====
const srow=c=>`<div class=sr data-id="${c.id}">${av(title(c),46)}<div class=srt><b>${esc(title(c))}</b><small>${TYPES[c.type]}</small></div></div>`;
function searchView(){
  sQ='';sTab='chats';
  app.innerHTML=`<div class=sh><div class=sbar><input id=si placeholder="Поиск чатов" autocomplete=off><button class=sx id=sx>${IC.x}</button></div></div>
  <div class=stabs><div class=stb data-s=chats>Чаты</div><div class=stb data-s=channel>Каналы</div><div class=stb data-s=apps>Приложения</div><div class=stb data-s=posts>Посты</div></div>
  <div class=sbody id=sb></div>`;
  $('si').oninput=e=>{sQ=e.target.value;sDraw()};
  $('sx').onclick=()=>{if($('si').value){$('si').value='';sQ='';sDraw();$('si').focus()}else home()};
  document.querySelectorAll('.stb').forEach(t=>t.onclick=()=>{sTab=t.dataset.s;sDraw()});
  $('si').focus();
  sDraw()}
function sDraw(){
  const b=$('sb');if(!b)return;
  sSeq++;
  document.querySelectorAll('.stb').forEach(t=>t.classList.toggle('on',t.dataset.s===sTab));
  if(sTab==='apps'||sTab==='posts'){b.innerHTML='<div class=empty>Скоро</div>';return}
  const t=sQ.trim().toLowerCase().replace(/^@/,'');
  const ok=c=>sTab==='chats'||c.type==='channel';
  if(!t){
    const peers=sTab==='chats'?CH.filter(c=>c.type!=='channel').slice(0,10):[];
    const rc=RC().map(id=>CH.find(c=>c.id===id)).filter(c=>c&&ok(c));
    b.innerHTML=(peers.length?`<div class=peers>${peers.map(c=>`<div class=pe data-id="${c.id}">${av(title(c),54)}<span>${esc(title(c).replace(/^@/,''))}</span></div>`).join('')}</div>`:'')
      +(rc.length?`<div class=band><span>Недавние</span><span id=clr>Очистить</span></div>${rc.map(srow).join('')}`:'')
      +(!peers.length&&!rc.length?'<div class=empty>Введите юзернейм, чтобы найти человека</div>':'');
    if($('clr'))$('clr').onclick=()=>{clrRC();sDraw()}}
  else{
    const m=CH.filter(c=>ok(c)&&title(c).toLowerCase().includes(t));
    b.innerHTML=m.map(srow).join('')+`<div id=sf>${m.length?'':'<div class=empty>Ничего не найдено</div>'}</div>`;
    if(sTab==='chats'&&/^[a-z0-9_]{3,20}$/.test(t))sFind(t)}
  b.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>openChat(e.dataset.id))}
async function sFind(n){
  const k=++sSeq;let r;
  try{r=await db.doc('usernames/'+n).get()}catch(e){return}
  if(k!==sSeq||!r.exists||r.data().uid===me.uid)return;
  if(CH.some(c=>c.type==='direct'&&title(c)==='@'+n))return;
  const box=$('sf');if(!box)return;
  box.innerHTML=`<div class=band><span>Глобальный поиск</span></div><div class=sr>${av('@'+n,46)}<div class=srt><b>@${esc(n)}</b><small>пользователь</small></div></div>`;
  box.querySelector('.sr').onclick=()=>openUser(n)}
async function openUser(n){
  const r=await db.doc('usernames/'+n).get();if(!r.exists)return alert('Не найден');
  const uid=r.data().uid;if(uid===me.uid)return alert('Это ты');
  const id=[me.uid,uid].sort().join('_');
  await db.doc('chats/'+id).set({type:'direct',members:[me.uid,uid],names:{[me.uid]:me.username,[uid]:n}},{merge:true});
  openChat(id)}

function topup(){

  app.innerHTML=`<div class=top><button class=ib id=bk>←</button><h2>Пополнить</h2></div><div class=body></div>`;

async function newChat(){
  const t=prompt('1 — группа, 2 — канал');if(t!=='1'&&t!=='2')return;
  const name=prompt('Название');if(!name)return;
  const us=(prompt('Юзернеймы участников через запятую')||'').split(',').map(s=>s.trim().replace('@','').toLowerCase()).filter(Boolean);
  const ids=[me.uid];
  for(const n of us){const r=await db.doc('usernames/'+n).get();if(r.exists&&!ids.includes(r.data().uid))ids.push(r.data().uid)}
  const ref=await db.collection('chats').add({type:t==='1'?'group':'channel',name,members:ids,owner:me.uid,lastAt:FV.serverTimestamp()});
  openChat(ref.id)}

// ===== ЧАТ =====
async function openChat(id){
  addRC(id);
  const c=(await db.doc('chats/'+id).get()).data();let key;
  if(c.type==='direct'){const o=c.members.find(x=>x!==me.uid);
    key=await shared(JSON.parse((await db.doc('users/'+o).get()).data().pub))}
  const can=c.type!=='channel'||c.owner===me.uid;
  app.innerHTML=`<div class=top><button class=ib id=bk>←</button>${av(title(c),36)}<h2>${esc(title(c))}</h2></div><div class=msgs id=ms></div>${can?'<form id=fm><input id=tx placeholder="Сообщение" autocomplete=off><button>➤</button></form>':''}`;
  $('bk').onclick=home;
  unsub();
  unsub=db.collection('chats/'+id+'/msgs').orderBy('at').limitToLast(100).onSnapshot(async s=>{
    const h=await Promise.all(s.docs.map(async d=>{
      const m=d.data();let t=m.text;
      if(m.ct){try{t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(m.iv)},key,ub(m.ct)))}catch(e){t='🔒 не удалось расшифровать'}}
      const mine=m.from===me.uid;
      return `<div class="m${mine?' me':''}">${!mine&&c.type!=='direct'?'<b>@'+esc(m.fromName)+'</b>':''}${esc(t)}</div>`}));
    const ms=$('ms');if(!ms)return;ms.innerHTML=h.join('');ms.scrollTop=ms.scrollHeight});
  if(can)$('fm').onsubmit=async e=>{
    e.preventDefault();const t=$('tx').value.trim();if(!t)return;$('tx').value='';
    const p={from:me.uid,fromName:me.username,at:FV.serverTimestamp()};
    if(c.type==='direct'){const iv=crypto.getRandomValues(new Uint8Array(12));
      p.iv=b64(iv);p.ct=b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(t)))}
    else p.text=t;
    await db.collection('chats/'+id+'/msgs').add(p);
    db.doc('chats/'+id).update({lastAt:FV.serverTimestamp()})}}
</script></body></html>
