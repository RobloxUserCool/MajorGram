<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2634"><title>MajorGram</title>
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#1c2634;color:#fff;font:16px system-ui,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{border:0;border-radius:24px;padding:14px 18px;background:#2ea6ff;color:#fff;font:inherit;font-weight:600}
button.alt{background:#2b3748}
input{width:100%;padding:15px 18px;border-radius:26px;border:0;background:#2b3748;color:#fff;font:inherit;outline:0}
.auth{margin:auto;width:min(340px,90%);display:flex;flex-direction:column;gap:10px}.auth h1{text-align:center}
#er{color:#ff7a8a;min-height:1em;font-size:14px}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.top h1,.top h2{flex:1;margin:0;font-size:28px}.top h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#2ea6ff,#8a5cff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;border:3px solid #34c37a}
.ib{background:none;color:#fff;font-size:26px;padding:4px 10px}
.body{flex:1;overflow:auto;padding:0 12px 130px}
.sq{margin:4px 0 14px}
.tabs{display:flex;background:#243040;border-radius:30px;padding:5px;margin-bottom:8px}
.tb{flex:1;text-align:center;padding:12px 6px;border-radius:25px;color:#9aa7b8;font-weight:600}
.tb.on{background:#2b4764;color:#5eb5f7}
.tb i{font-style:normal;font-size:14px;background:#3a4658;color:#fff;border-radius:12px;padding:1px 8px;margin-left:4px}
.tb.on i{background:#4aa8ee;color:#10243a}
.row{display:flex;gap:14px;padding:10px 8px;align-items:center}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex:none}
.rt{flex:1;min-width:0}.l1{display:flex;justify-content:space-between;align-items:baseline}
.l1 b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 small{color:#8493a6;font-size:14px;margin-left:8px}
.l2{color:#8493a6;font-size:17px;margin-top:2px}
.empty{color:#8493a6;text-align:center;padding:40px 20px}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 0}.prof small{color:#8493a6}
.wide{width:100%;margin:10px 0}
.grp{background:#222f3f;border-radius:20px;margin:0 0 14px;overflow:hidden}
.it{display:flex;gap:16px;align-items:center;padding:13px 16px}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;color:#fff}
.itt{flex:1;font-size:18px}.itt small{display:block}
.sub{color:#8493a6;font-size:15px}.val{color:#5eb5f7;font-size:20px}
.gt{color:#5eb5f7;font-weight:600;padding:14px 16px 0}
.ver{text-align:center;color:#6b7a8d;font-size:14px;margin:6px 0}
.bal{display:flex;justify-content:center;align-items:center;gap:10px;font-size:44px}
.btns{display:flex;gap:12px;margin:16px 0 14px}.btns button{flex:1}
.lnk{color:#5eb5f7;display:block}
.new{font-size:12px;background:#2ea6ff;border-radius:6px;padding:2px 6px;margin-left:6px}
.tabs2{display:flex;gap:22px;color:#8493a6;font-weight:600;padding:8px 4px;overflow:auto;white-space:nowrap;text-align:left}.tabs2 .on{color:#5eb5f7}
.sub2{color:#cfd7e3;padding:0 10px;line-height:1.4}.sub2 a{color:#5eb5f7}
.fab{position:absolute;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;padding:0;box-shadow:0 4px 14px #0008;display:flex;align-items:center;justify-content:center}
.fab svg{width:28px;height:28px}
nav{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;background:#243245ee;border-radius:36px;padding:6px;backdrop-filter:blur(8px)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:30px;font-size:13px;font-weight:600}
.ni svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ni.on{background:#2d4863;color:#5eb5f7}
.mnu{position:absolute;right:12px;top:calc(62px + env(safe-area-inset-top));background:#2b3748;border-radius:14px;padding:6px 0;z-index:5;box-shadow:0 6px 20px #000a}
.mnu[hidden]{display:none}.mnu div{padding:14px 20px}
.msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#0e1621}
.m{max-width:78%;padding:8px 12px;border-radius:16px 16px 16px 4px;background:#182533;white-space:pre-wrap;word-break:break-word;align-self:flex-start}
.m.me{background:#2b5278;border-radius:16px 16px 4px 16px;align-self:flex-end}
.m b{display:block;font-size:13px;color:#6ab3f3}
form{display:flex;gap:8px;padding:8px 10px;background:#17212b}
form button{width:48px;height:48px;border-radius:50%;padding:0;font-size:20px;flex:none}
</style></head><body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyATikQr2x_dEq_rAga1m4--gVCCVQdR3-M",
  authDomain:"majorgram-3cd73.firebaseapp.com",
  projectId:"majorgram-3cd73",
  appId:"1:1026895019291:web:e9e8b0e01c992a33b327be"
});

const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
const app=document.getElementById('app'),$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,K,unsub=()=>{},unsubList=()=>{},busy=0,tab='chats',flt='all',q='',CH=[],STARS=0;

// ===== ШИФРОВАНИЕ (личные чаты) =====
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const EC={name:'ECDH',namedCurve:'P-256'};
async function keys(){const s=localStorage.getItem('mg_k');if(s)return JSON.parse(s);
  const p=await crypto.subtle.generateKey(EC,true,['deriveKey']);
  const o={priv:await crypto.subtle.exportKey('jwk',p.privateKey),pub:await crypto.subtle.exportKey('jwk',p.publicKey)};
  localStorage.setItem('mg_k',JSON.stringify(o));return o}
async function shared(pubJ){
  const pr=await crypto.subtle.importKey('jwk',K.priv,EC,false,['deriveKey']);
  const pu=await crypto.subtle.importKey('jwk',pubJ,EC,false,[]);
  return crypto.subtle.deriveKey({name:'ECDH',public:pu},pr,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

// ===== ВХОД / РЕГИСТРАЦИЯ =====
const run=async f=>{try{await f()}catch(e){$('er').textContent=e.message}};
function authView(){
  app.innerHTML=`<div class=auth><h1>MajorGram</h1><input id=em type=email placeholder="Почта"><input id=pw type=password placeholder="Пароль"><input id=un placeholder="@юзернейм (для регистрации)"><button id=li>Войти</button><button id=su class=alt>Регистрация</button><p id=er></p></div>`;
  $('li').onclick=()=>run(()=>auth.signInWithEmailAndPassword($('em').value,$('pw').value));
  $('su').onclick=()=>run(async()=>{
    const n=$('un').value.replace('@','').trim().toLowerCase();
    if(!/^[a-z0-9_]{3,20}$/.test(n))throw Error('Юзернейм: 3–20 символов, a-z, 0-9 и _');
    busy=1;let c;
    try{
      c=await auth.createUserWithEmailAndPassword($('em').value,$('pw').value);
      K=await keys();
      await db.runTransaction(async t=>{
        const r=db.doc('usernames/'+n);
        if((await t.get(r)).exists)throw Error('Юзернейм занят');
        t.set(r,{uid:c.user.uid});
        t.set(db.doc('users/'+c.user.uid),{username:n,pub:JSON.stringify(K.pub)})});
    }catch(e){if(c)await c.user.delete();busy=0;throw e}
    busy=0;await begin(c.user)})}
auth.onAuthStateChanged(async u=>{if(busy)return;unsub();unsubList();
  if(!u){if(!$('li'))authView();return}
  await begin(u)});
async function begin(u){
  K=await keys();
  const d=await db.doc('users/'+u.uid).get();
  if(!d.exists){await auth.signOut();return}
  me={uid:u.uid,...d.data()};
  if(d.data().pub!==JSON.stringify(K.pub))await db.doc('users/'+u.uid).update({pub:JSON.stringify(K.pub)});
  home()}

// ===== ВИД =====
const TYPES={direct:'личный чат',group:'группа',channel:'канал'};
const title=c=>c.type==='direct'?'@'+c.names[Object.keys(c.names).find(k=>k!==me.uid)]:c.name;
const COLS=['#e17076','#faa774','#a695e7','#7bc862','#6ec9cb','#65aadd','#ee7aae'];
const av=(t,s=52)=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;
  const l=[...t.replace(/^@/,'')][0]||'?';
  return `<div class=av style="width:${s}px;height:${s}px;background:${COLS[h%7]};font-size:${s*.42}px">${esc(l.toUpperCase())}</div>`};
const fmt=ts=>{if(!ts)return'';const d=ts.toDate(),n=new Date();
  return d.toDateString()===n.toDateString()?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{day:'2-digit',month:'2-digit'})};
const IC={
  chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  con:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18c2-3.5 9-3.5 11 0"/></svg>',
  set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>',
  pro:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r=".8"/><circle cx="15" cy="10" r=".8"/><path d="M8 14c1 2 7 2 8 0"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>'};
const rowHtml=c=>`<div class=row data-id="${c.id}">${av(title(c))}<div class=rt><div class=l1><b>${esc(title(c))}</b><small>${fmt(c.lastAt)}</small></div><div class=l2>${TYPES[c.type]}</div></div></div>`;
const bindRows=()=>document.querySelectorAll('.row[data-id]').forEach(r=>r.onclick=()=>openChat(r.dataset.id));
const soon=()=>alert('Скоро');

// ===== ЗВЁЗДЫ =====
// Баланс лежит в stars/{uid}.balance. Из приложения его менять нельзя (см. правила Firestore).
async function getStars(){try{const d=await db.doc('stars/'+me.uid).get();return d.exists?(d.data().balance||0):0}catch(e){return 0}}

// ===== ГЛАВНЫЙ ЭКРАН =====
function home(){
  unsub();unsubList();
  const st=tab==='settings';
  const head=st?'<div class=top><h1 style="font-size:26px">Настройки</h1></div>'
    :'<div class=top><div class=logo>M</div><h1>MajorGram</h1><button class=ib id=mn>⋮</button></div><div class=mnu id=mnu hidden><div id=m1>Новая группа или канал</div><div id=m2>Найти пользователя</div><div id=m3>Выйти</div></div>';
  app.innerHTML=`${head}<div class=body id=bd></div>${tab==='chats'?`<button class=fab id=fb>${IC.pen}</button>`:''}
  <nav>${[['chats','Чаты',IC.chat],['contacts','Контакты',IC.con],['settings','Настройки',IC.set],['profile','Профиль',IC.pro]].map(([k,n,i])=>`<div class="ni${tab===k?' on':''}" data-t="${k}">${i}<span>${n}</span></div>`).join('')}</nav>`;
  if(!st){
    $('mn').onclick=()=>$('mnu').hidden=!$('mnu').hidden;
    $('m1').onclick=()=>{$('mnu').hidden=true;newChat()};
    $('m2').onclick=()=>{$('mnu').hidden=true;search()};
    $('m3').onclick=()=>auth.signOut()}
  if(tab==='chats')$('fb').onclick=search;
  document.querySelectorAll('.ni').forEach(n=>n.onclick=()=>{tab=n.dataset.t;home()});
  unsubList=db.collection('chats').where('members','array-contains',me.uid).onSnapshot(s=>{
    CH=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.lastAt?.seconds||0)-(x.lastAt?.seconds||0));
    $('cl')?list():draw()});
  draw()}
function list(){
  const l=$('cl');if(!l)return;
  $('c1').textContent=CH.length;$('c2').textContent=CH.filter(c=>c.type==='channel').length;
  const a=CH.filter(c=>(flt==='all'||c.type==='channel')&&title(c).toLowerCase().includes(q.toLowerCase()));
  l.innerHTML=a.map(rowHtml).join('')||'<div class=empty>Пока пусто. Нажми ✎ и найди человека по юзернейму</div>';
  bindRows()}
function draw(){
  const b=$('bd');if(!b)return;
  if(tab==='chats'){
    b.innerHTML=`<input id=sq class=sq placeholder="Поиск чатов" value="${esc(q)}"><div class=tabs><div class="tb${flt==='all'?' on':''}" data-f=all>Все чаты <i id=c1>0</i></div><div class="tb${flt==='channel'?' on':''}" data-f=channel>Каналы <i id=c2>0</i></div></div><div id=cl></div>`;
    $('sq').oninput=e=>{q=e.target.value;list()};
    document.querySelectorAll('.tb').forEach(t=>t.onclick=()=>{flt=t.dataset.f;draw()});
    list()}
  else if(tab==='contacts'){
    const a=CH.filter(c=>c.type==='direct');
    b.innerHTML=`<button class="wide" id=fd>Найти по юзернейму</button>`+(a.map(rowHtml).join('')||'<div class=empty>Контактов пока нет</div>');
    $('fd').onclick=search;bindRows()}
  else if(tab==='settings'){
    const it=(a,c,i,t,r='')=>`<div class=it data-a=${a}><div class=ico style="background:${c}">${i}</div><div class=itt>${t}</div>${r}</div>`;
    b.innerHTML=`<div class=grp>${it('lang','#a355e8','🌐','Язык<small class=sub>Русский</small>')}</div>
    <div class=grp>${it('prem','#7b6cf0','★','MajorGram Premium')}${it('stars','#f5a623','★','Звёзды MajorGram',`<span class=val id=sbal>${STARS}</span>`)}${it('biz','#e5484d','🏪','MajorGram для бизнеса')}${it('gift','#f2711c','🎁','Отправить подарок')}</div>
    <div class=grp><div class=gt>Помощь</div>${it('ask','#f5a623','💬','Задать вопрос')}${it('faq','#2ea6ff','?','Вопросы о MajorGram')}${it('feat','#a355e8','💡','Возможности MajorGram')}${it('priv','#34c37a','🛡','Политика конфиденциальности')}</div>
    <div class=grp>${it('out','#2b3748','⎋','Выйти из аккаунта')}</div>
    <p class=ver>MajorGram v0.1</p>`;
    b.querySelectorAll('.it').forEach(e=>e.onclick=()=>{const a=e.dataset.a;a==='stars'?starsView():a==='out'?auth.signOut():soon()});
    getStars().then(n=>{STARS=n;const e=$('sbal');if(e)e.textContent=n})}
  else{
    b.innerHTML=`<div class=prof>${av('@'+me.username,96)}<h2>@${esc(me.username)}</h2><small>${esc(auth.currentUser.email||'')}</small></div>`}}

// ===== ЭКРАН «ЗВЁЗДЫ MAJORGRAM» =====
function starsView(){
  app.innerHTML=`<div class=top><button class=ib id=bk>←</button></div><div class=body style="text-align:center;padding-bottom:30px">
  <svg width=130 height=130 viewBox="0 0 24 24"><defs><linearGradient id=g1 x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#fff35c"/><stop offset=1 stop-color="#f5a623"/></linearGradient></defs><path fill="url(#g1)" stroke="#ffd23f" stroke-linejoin="round" stroke-width="1" d="M12 2.5l2.9 6.3 6.8.7-5.1 4.6 1.5 6.8L12 17.4l-6.1 3.5 1.5-6.8L2.3 9.5l6.8-.7z"/></svg>
  <h1 style="margin:10px 0 8px;font-size:26px">Звёзды MajorGram</h1>
  <p class=sub2>Звёзды MajorGram нужны для оплаты контента и услуг. <a id=more>Подробнее о звёздах ›</a></p>
  <div class=grp style="padding:22px 16px;margin:22px 0 14px"><div class=bal><span>⭐</span><b id=sv>${STARS}</b></div><div class=sub>Ваш баланс</div>
  <div class=btns><button id=tp>＋ Пополнить</button><button id=stt>📊 Статистика</button></div><a id=gf class=lnk>🎁 Подарить звёзды друзьям</a></div>
  <div class="grp it" id=earn style="text-align:left"><div class=ico style="background:#34c37a">★</div><div class=itt>Заработать звёзды <span class=new>NEW</span><small class=sub>Скоро</small></div></div>
  <div class=tabs2><span class=on>Все операции</span><span>Зачисления</span><span>Списания</span></div>
  <div class=empty>Операций пока нет</div></div>`;
  $('bk').onclick=home;$('tp').onclick=topup;
  ['more','stt','gf','earn'].forEach(i=>$(i).onclick=soon);
  getStars().then(n=>{STARS=n;if($('sv'))$('sv').textContent=n})}
function topup(){
  // СЮДА ПОЗЖЕ ДОБАВИМ ПЕРЕХОД В ТЕЛЕГРАМ-БОТА ДЛЯ ПОКУПКИ ЗВЁЗД
  app.innerHTML=`<div class=top><button class=ib id=bk>←</button><h2>Пополнить</h2></div><div class=body></div>`;
  $('bk').onclick=starsView}

async function search(){
  const n=(prompt('Юзернейм (без @)')||'').trim().toLowerCase().replace('@','');if(!n)return;
  const r=await db.doc('usernames/'+n).get();if(!r.exists)return alert('Не найден');
  const uid=r.data().uid;if(uid===me.uid)return alert('Это ты');
  const id=[me.uid,uid].sort().join('_');
  await db.doc('chats/'+id).set({type:'direct',members:[me.uid,uid],names:{[me.uid]:me.username,[uid]:n}},{merge:true});
  openChat(id)}
async function newChat(){
  const t=prompt('1 — группа, 2 — канал');if(t!=='1'&&t!=='2')return;
  const name=prompt('Название');if(!name)return;
  const us=(prompt('Юзернеймы участников через запятую')||'').split(',').map(s=>s.trim().replace('@','').toLowerCase()).filter(Boolean);
  const ids=[me.uid];
  for(const n of us){const r=await db.doc('usernames/'+n).get();if(r.exists&&!ids.includes(r.data().uid))ids.push(r.data().uid)}
  const ref=await db.collection('chats').add({type:t==='1'?'group':'channel',name,members:ids,owner:me.uid,lastAt:FV.serverTimestamp()});
  openChat(ref.id)}

// ===== ЧАТ =====
async function openChat(id){
  const c=(await db.doc('chats/'+id).get()).data();let key;
  if(c.type==='direct'){const o=c.members.find(x=>x!==me.uid);
    key=await shared(JSON.parse((await db.doc('users/'+o).get()).data().pub))}
  const can=c.type!=='channel'||c.owner===me.uid;
  app.innerHTML=`<div class=top><button class=ib id=bk>←</button>${av(title(c),40)}<h2>${esc(title(c))}</h2></div><div class=msgs id=ms></div>${can?'<form id=fm><input id=tx placeholder="Сообщение" autocomplete=off><button>➤</button></form>':''}`;
  $('bk').onclick=home;
  unsub();
  unsub=db.collection('chats/'+id+'/msgs').orderBy('at').limitToLast(100).onSnapshot(async s=>{
    const h=await Promise.all(s.docs.map(async d=>{
      const m=d.data();let t=m.text;
      if(m.ct){try{t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(m.iv)},key,ub(m.ct)))}catch(e){t='🔒 не удалось расшифровать'}}
      const mine=m.from===me.uid;
      return `<div class="m${mine?' me':''}">${!mine&&c.type!=='direct'?'<b>@'+esc(m.fromName)+'</b>':''}${esc(t)}</div>`}));
    const ms=$('ms');if(!ms)return;ms.innerHTML=h.join('');ms.scrollTop=ms.scrollHeight});
  if(can)$('fm').onsubmit=async e=>{
    e.preventDefault();const t=$('tx').value.trim();if(!t)return;$('tx').value='';
    const p={from:me.uid,fromName:me.username,at:FV.serverTimestamp()};
    if(c.type==='direct'){const iv=crypto.getRandomValues(new Uint8Array(12));
      p.iv=b64(iv);p.ct=b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(t)))}
    else p.text=t;
    await db.collection('chats/'+id+'/msgs').add(p);
    db.doc('chats/'+id).update({lastAt:FV.serverTimestamp()})}}
</script></body></html>
